name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Stable asserts under ANSI / parallel tree races.
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      # Serialize light doctest trees: parallel go mod tidy races on shared genDir go.mod
      GOMAXPROCS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test -v ./...

      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      # cmd/fake-opencode is not in module github.com/xhd2015/agent-pro (nested
      # cmd/go.mod + replace). Checkout the repo and build from source.
      - name: Checkout agent-pro for fake-opencode
        uses: actions/checkout@v4
        with:
          repository: xhd2015/agent-pro
          path: external/agent-pro-ci
      - name: Build fake-opencode
        run: |
          mkdir -p "$HOME/go/bin"
          # Nested cmd/go.mod: build from that package dir (replace => .. is OK as main module).
          go build -C ./external/agent-pro-ci/cmd/fake-opencode -mod=mod -o "$HOME/go/bin/fake-opencode" .
          command -v fake-opencode
      - name: Doctest
        run: doctest test -v --label-all ./...
